services:
  - type: web
    name: cortex-gt-extractor
    runtime: docker
    plan: starter
    dockerfilePath: ./gt-extractor/backend/Dockerfile
    dockerContext: ./gt-extractor/backend
    healthCheckPath: /api/health
    autoDeploy: false
    disk:
      name: cortex-gt-extractor-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GT_ALLOWED_ORIGINS
        sync: false
      - key: GT_DATA_DIR
        value: /app/data
      - key: GT_DB_PATH
        value: /app/data/cortex_extractor.sqlite3
      - key: GT_MAX_UPLOAD_BYTES
        value: "536870912"
      - key: GT_MAX_FILES
        value: "500"
      - key: GT_MAX_ARCHIVE_BYTES
        value: "2147483648"
      - key: GT_MAX_MEMBER_BYTES
        value: "41943040"
      - key: GT_MAX_TOTAL_EXTRACTED_BYTES
        value: "268435456"
