name: GT Extractor Tests

on:
  pull_request:
    paths:
      - "gt-extractor/backend/**"
      - ".github/workflows/gt-extractor-tests.yml"
  push:
    branches: ["feat/gt-extractor-mvp"]
    paths:
      - "gt-extractor/backend/**"
      - ".github/workflows/gt-extractor-tests.yml"

jobs:
  parser-and-storage-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gt-extractor/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gt-extractor/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
