<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe7b1"/><stop offset=".55" stop-color="#d9b16d"/><stop offset="1" stop-color="#a8753d"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ceaff"/><stop offset=".55" stop-color="#4ac5f4"/><stop offset="1" stop-color="#1686ca"/></linearGradient><filter id="halo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>
.goldArc{fill:none;stroke:url(#gold);stroke-width:5.3;stroke-linecap:round;stroke-dasharray:520;stroke-dashoffset:520;animation:drawGold 2.2s cubic-bezier(.2,.7,.2,1) .45s forwards,shineGold 2.3s ease-in-out 2.8s infinite}
.brain{fill:none;stroke:url(#blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:360;stroke-dashoffset:360;animation:drawBrain 1.75s ease-out .05s forwards,shineBlue 2.2s ease-in-out 1.8s infinite}
.net{fill:none;stroke:#6bd6ff;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:180;stroke-dashoffset:180;animation:drawNet 1.2s ease-out .55s forwards}
.orbitStars{animation:starAura 2.2s ease-in-out infinite;transform-origin:160px 160px}.node{fill:#b9efff;opacity:0;filter:url(#halo);transform-box:fill-box;transform-origin:center;animation:lightNode .55s ease-out forwards,blink 2.2s ease-in-out 2.5s infinite}
.n1{animation-delay:.8s,2.5s}.n2{animation-delay:1.05s,2.7s}.n3{animation-delay:1.3s,2.9s}.n4{animation-delay:1.55s,3.1s}.n5{animation-delay:1.8s,3.3s}.n6{animation-delay:2.05s,3.5s}.n7{animation-delay:2.3s,3.7s}.n8{animation-delay:2.55s,3.9s}
@keyframes starAura{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drawGold{to{stroke-dashoffset:0}}@keyframes drawBrain{to{stroke-dashoffset:0}}@keyframes drawNet{to{stroke-dashoffset:0}}@keyframes lightNode{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.6)}100%{opacity:.95;transform:scale(1)}}@keyframes blink{0%,100%{opacity:.75}50%{opacity:1;filter:url(#halo) brightness(1.5)}}@keyframes shineBlue{0%,100%{filter:drop-shadow(0 0 1px #168de2)}50%{filter:drop-shadow(0 0 7px #42c9ff)}}@keyframes shineGold{0%,100%{filter:drop-shadow(0 0 2px #e6b766)}50%{filter:drop-shadow(0 0 9px #ffd98d)}}
